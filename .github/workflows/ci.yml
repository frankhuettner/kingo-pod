name: ci

# ON THIS BRANCH ONLY (wip/playwright-trial): the jobs of the real CI are taken out, and one trial runs in their
# place. This branch is never merged; main keeps its own ci.yml.
#
# The trial: can Claude click through a page with Playwright inside the sandbox of `kingo claude`?
# See .github/scripts/playwright-trial.sh. It reports and fails only when it cannot set up.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-trial:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 is what Windows (WSL) installs; the Mac has another sandbox (Seatbelt) and no lock.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code; kingo gets its own nono
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./kingo claude nono
          dirname "$(ls "$HOME"/.local/share/kingo/nono/*/nono)" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          uname -srm
          nono --version
          claude --version
          node --version
          npm --version

      - name: "Round 3: one port of localhost inside nono, and playwright-core on its page and on the internet"
        run: bash .github/scripts/port-trial.sh

      - name: Keep the pictures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trial-${{ matrix.os }}
          path: |
            claude/look/*.png
          if-no-files-found: ignore
